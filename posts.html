<!DOCTYPE html>
<html lang="ja">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ヘッダー -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">立川山岳会</a>
      
      <!-- ▼ メニュー部分を .nav-links で囲みました -->
      <div class="nav-links">
        <nav>
          <a href="index.html">Home</a>
          <a href="post.html?file=about.md">入会案内</a>
          <a href="post.html?file=list/list.md">山行リスト</a>

      <button class="hamburger-btn" aria-label="メニューを開閉">
        <span></span>

    <h2 class="section-title">山行記録 一覧</h2>
